<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia T40 - Mataró</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #000;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            margin-top: 8px;
        }

        .hero {
            padding: 70px 20px;
            text-align: center;
            background: linear-gradient(135deg, #111, #2a2a2a);
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: white;
            color: black;
            padding: 14px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
        }

        .button.dark {
            background: #222;
            color: white;
            border: 1px solid #555;
        }

        section {
            padding: 50px 20px;
            max-width: 900px;
            margin: auto;
        }

        section h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .services {
            display: grid;
            gap: 15px;
        }

        .service {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .service h3 {
            font-size: 19px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        .contact {
            text-align: center;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 35px 20px;
        }

        .contact p {
            color: #ccc;
            margin: 10px 0;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            border-top: 1px solid #333;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>BARBERIA T40</h1>
        <p>Mataró</p>
    </header>

    <div class="hero">
        <h2>Tu estilo. Tu barbería.</h2>
        <p>Cortes modernos y barba con estilo.</p>

        <a class="button" href="https://wa.me/34602852691">
            Reservar por WhatsApp
        </a>

        <a class="button dark" href="https://instagram.com/barberia.t40">
            Instagram
        </a>
    </div>

    <section>
        <h2>Servicios</h2>

        <div class="services">

            <div class="service">
                <h3>Corte</h3>
                <div class="price">10€</div>
            </div>

            <div class="service">
                <h3>La barba</h3>
                <div class="price">6€</div>
            </div>

            <div class="service">
                <h3>Corte + barba</h3>
                <div class="price">15€</div>
            </div>

        </div>
    </section>

    <section>
        <div class="contact">
            <h2>Contacta con nosotros</h2>
            <p>📍 Mataró</p>
            <p>📱 602 852 691</p>

            <br>

            <a class="button" href="https://wa.me/34602852691">
                WhatsApp
            </a>
        </div>
    </section>

    <footer>
        ©️ 2026 Barberia T40 - Mataró
    </footer>

</body>
</html>
